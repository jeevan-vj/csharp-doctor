name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet: ['9.0.x', '10.0.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore
        run: dotnet restore CSharpDoctor.sln

      - name: Build
        run: dotnet build CSharpDoctor.sln --no-restore -c Release

      - name: Test
        run: dotnet test CSharpDoctor.sln --no-build -c Release --verbosity normal

      - name: Pack CLI
        if: matrix.os == 'ubuntu-latest' && matrix.dotnet == '9.0.x'
        run: dotnet pack src/CSharpDoctor.Cli/CSharpDoctor.Cli.csproj -c Release -o ./artifacts

      - name: Upload package
        if: matrix.os == 'ubuntu-latest' && matrix.dotnet == '9.0.x'
        uses: actions/upload-artifact@v4
        with:
          name: csharp-doctor-cli
          path: ./artifacts/*.nupkg
